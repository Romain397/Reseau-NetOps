   no switchport
   ip address 172.16.0.13/30
   no shutdown
!
interface Ethernet1
   description p1:Ethernet3
   no switchport
   ip address 10.0.0.17/30
   no shutdown
!
interface Ethernet2
   description p2:Ethernet3
   no switchport
   ip address 10.0.0.21/30
   no shutdown
!
end
