hostname pe-par
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.31.255.13/24
   no shutdown
!
ip route vrf MGMT 0.0.0.0/0 172.31.255.1
!
ip routing
!
interface Loopback0
   ip address 10.255.0.11/32
!
interface Ethernet3
   description ce-a-par:Ethernet1
   no switchport
   ip address 172.16.0.1/30
   no shutdown
!
interface Ethernet4
   description ce-b-par:Ethernet1
   no switchport
   ip address 172.16.0.9/30
   no shutdown
!
interface Ethernet1
   description p1:Ethernet1
   no switchport
   ip address 10.0.0.1/30
   no shutdown
!
interface Ethernet2
   description p2:Ethernet1
   no switchport
   ip address 10.0.0.5/30
   no shutdown
!
end
