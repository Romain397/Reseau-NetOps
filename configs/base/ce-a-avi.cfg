! Généré par scripts/prepare.py depuis data/fabric.yml (phase de base).
hostname ce-a-avi
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.31.255.18/24
   no shutdown
!
ip route vrf MGMT 0.0.0.0/0 172.31.255.1
!
ip routing
!
interface Loopback0
   ip address 10.255.0.102/32
!
interface Ethernet1
   description pe-avi:Ethernet3
   no switchport
   ip address 172.16.0.6/30
   no shutdown
!
interface Ethernet2
   description host-a-avi:eth1
   no switchport
   ip address 10.10.20.1/24
   no shutdown
!
end
