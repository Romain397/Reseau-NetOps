hostname ce-a-par
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   ip address 172.31.255.17/24
   no shutdown
!
ip route vrf MGMT 0.0.0.0/0 172.31.255.1
!
ip routing
!
interface Loopback0
   ip address 10.255.0.101/32
!
interface Ethernet1
   description pe-par:Ethernet3
   no switchport
   ip address 172.16.0.2/30
   no shutdown
!
interface Ethernet2
   description host-a-par:eth1
   no switchport
   ip address 10.10.10.1/24
   no shutdown
!
end
