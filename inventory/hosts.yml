---
# Inventaire préparatoire : 2 VM fournies et 13 équipements réseau proposés.
# Les IP des VM sont observées (DHCP) ; celles des conteneurs restent proposées.
# Les accès SSH/eAPI ne sont pas vérifiés depuis toolsG2.
# Les noms en minuscules correspondent aux équipements du schéma utilisateur.
all:
  children:
    infrastructure:
      vars:
        ansible_connection: ssh
        ansible_user: NetOps
      hosts:
        toolsG2:
          ansible_host: 10.108.2.29
          planned_role: automation_and_monitoring
        labG2:
          ansible_host: 10.108.2.65
          planned_role: containerlab_host
    eos:
      children:
        core:
          hosts:
            p1:
              ansible_host: 172.31.255.11
              role: rr
            p2:
              ansible_host: 172.31.255.12
              role: p
        pe:
          hosts:
            pe-par:
              ansible_host: 172.31.255.13
              role: pe
              tenant_names: [TENANT_1, TENANT_2]
            pe-avi:
              ansible_host: 172.31.255.14
              role: pe
              tenant_names: [TENANT_1]
            pe-bdx:
              ansible_host: 172.31.255.15
              role: pe
              tenant_names: [TENANT_2]
        ce:
          hosts:
            ce-a-par:
              ansible_host: 172.31.255.17
              role: ce
            ce-a-avi:
              ansible_host: 172.31.255.18
              role: ce
            ce-b-par:
              ansible_host: 172.31.255.19
              role: ce
            ce-b-bdx:
              ansible_host: 172.31.255.20
              role: ce
    clients:
      hosts:
        host-a-par:
          ansible_host: 172.31.255.101
        host-a-avi:
          ansible_host: 172.31.255.102
        host-b-par:
          ansible_host: 172.31.255.103
        host-b-bdx:
          ansible_host: 172.31.255.104
