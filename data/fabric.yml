---
# Brouillon des variables et du plan d'adressage (étapes 3 et 5).
# Aucune valeur proposée n'a été appliquée par cette préparation.
# Choix proposés, à adapter si le sujet ou le laboratoire impose d'autres valeurs.
environment:
  # Informations observées dans les sorties ip a fournies par l'utilisateur.
  infrastructure_subnet: 10.108.2.0/24
  access_user: NetOps
  addressing: dhcp
  vms:
    toolsG2:
      address: 10.108.2.29
      interface: ens18
      prefix_length: 24
      # Affectation proposée, services et ressources non vérifiés.
      planned_role: automation_and_monitoring
      observed_bridge: br-4b600d8327cc
      observed_bridge_state: DOWN
    labG2:
      address: 10.108.2.65
      interface: ens18
      prefix_length: 24
      planned_role: containerlab_host
      observed_bridge: br-c5b16cfe8a39
      observed_bridge_state: UP
  observed_docker_subnets:
    - 172.17.0.0/16
    - 172.18.0.0/16
  management_access:
    # Conception uniquement : aucune route ou règle de filtrage appliquée.
    source_vm: toolsG2
    destination_vm: labG2
    planned_mode: routed_access_to_lab_management
    proposed_next_hop: 10.108.2.65
    status: to_validate
lab_name: netops
provider_as: 65000
management_subnet: 172.31.255.0/24
management_gateway: 172.31.255.1
# Ce réseau de management est prévu uniquement sur labG2.
# L'adresse .1 représente sa passerelle de bridge proposée, pas celle du LAN VM.
# Images à identifier lors de l'étape 4, sans installation ni import à ce stade.
ceos_image: null
host_image: null
tenants:
  TENANT_1:
    subsidiary: A
    rt: "65000:100"
  TENANT_2:
    subsidiary: B
    rt: "65000:200"
core:
  p1:
    role: rr
    loopback: 10.255.0.1
    management: 172.31.255.11
  p2:
    role: p
    loopback: 10.255.0.2
    management: 172.31.255.12
pes:
  pe-par:
    loopback: 10.255.0.11
    management: 172.31.255.13
  pe-avi:
    loopback: 10.255.0.12
    management: 172.31.255.14
  pe-bdx:
    loopback: 10.255.0.13
    management: 172.31.255.15
sites:
  - id: a-par
    city: Paris
    tenant: TENANT_1
    pe: pe-par
    pe_interface: Ethernet3
    ce_loopback: 10.255.0.101
    ce_management: 172.31.255.17
    host_management: 172.31.255.101
    ce_as: 65101
    lan: 10.10.10.0/24
    gateway: 10.10.10.1
    host_ip: 10.10.10.10
    pe_ce: [172.16.0.1/30, 172.16.0.2/30]
  - id: a-avi
    city: Avignon
    tenant: TENANT_1
    pe: pe-avi
    pe_interface: Ethernet3
    ce_loopback: 10.255.0.102
    ce_management: 172.31.255.18
    host_management: 172.31.255.102
    ce_as: 65102
    lan: 10.10.20.0/24
    gateway: 10.10.20.1
    host_ip: 10.10.20.10
    pe_ce: [172.16.0.5/30, 172.16.0.6/30]
  - id: b-par
    city: Paris
    tenant: TENANT_2
    pe: pe-par
    pe_interface: Ethernet4
    ce_loopback: 10.255.0.103
    ce_management: 172.31.255.19
    host_management: 172.31.255.103
    ce_as: 65201
    lan: 10.20.10.0/24
    gateway: 10.20.10.1
    host_ip: 10.20.10.10
    pe_ce: [172.16.0.9/30, 172.16.0.10/30]
  - id: b-bdx
    city: Bordeaux
    tenant: TENANT_2
    pe: pe-bdx
    pe_interface: Ethernet3
    ce_loopback: 10.255.0.104
    ce_management: 172.31.255.20
    host_management: 172.31.255.104
    ce_as: 65202
    lan: 10.20.20.0/24
    gateway: 10.20.20.1
    host_ip: 10.20.20.10
    pe_ce: [172.16.0.13/30, 172.16.0.14/30]
# Chaque PE utilise Ethernet1 vers P1 et Ethernet2 vers P2.
# Paris : Ethernet3 vers CE-A-PAR, Ethernet4 vers CE-B-PAR.
# Sur chaque P : Ethernet1 Paris, Ethernet2 Avignon, Ethernet3 Bordeaux.
backbone:
  - endpoints: [pe-par:Ethernet1, p1:Ethernet1]
    addresses: [10.0.0.1/30, 10.0.0.2/30]
  - endpoints: [pe-par:Ethernet2, p2:Ethernet1]
    addresses: [10.0.0.5/30, 10.0.0.6/30]
  - endpoints: [pe-avi:Ethernet1, p1:Ethernet2]
    addresses: [10.0.0.9/30, 10.0.0.10/30]
  - endpoints: [pe-avi:Ethernet2, p2:Ethernet2]
    addresses: [10.0.0.13/30, 10.0.0.14/30]
  - endpoints: [pe-bdx:Ethernet1, p1:Ethernet3]
    addresses: [10.0.0.17/30, 10.0.0.18/30]
  - endpoints: [pe-bdx:Ethernet2, p2:Ethernet3]
    addresses: [10.0.0.21/30, 10.0.0.22/30]
  - endpoints: [p1:Ethernet4, p2:Ethernet4]
    addresses: [10.0.0.25/30, 10.0.0.26/30]
